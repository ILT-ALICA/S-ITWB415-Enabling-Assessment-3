<section class="profile-card" id="layug_profile">

    <h2>{{ name() }}</h2>

    <img [src]="imagePath()" alt="name()" class="profile-image">

    <br>

    <button mat-raised-button class="description-button" (click)="showDescription()">About Me</button>

    <p class="profile-description">{{ description() }}</p>

</section>
